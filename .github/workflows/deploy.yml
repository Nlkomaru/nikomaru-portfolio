name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

  deploy-app:
    needs: check
    env:
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
    runs-on: ubuntu-latest
    name: Deploy App
    steps:
      - uses: actions/checkout@v4

      - name: Get secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
          secrets: |
            2bad9e23-82af-4fba-b514-b49900e1632f > CLOUDFLARE_ACCOUNT_ID
            f1bf4fa4-0288-4a31-b28b-b499013acdce > CLOUDFLARE_API_KEY

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Build app
        run: pnpm run build

      - name: Write Worker secrets file
        run: |
          node <<'EOF'
          const fs = require("node:fs");

          // CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET は Worker の secrets_store_secrets
          // バインディング (wrangler.jsonc) から供給されるため、ここでは push しない。
          const secretNames = [
            "R2_PUBLIC_URL",
          ];
          const missingSecretNames = secretNames.filter((name) => !process.env[name]);

          if (missingSecretNames.length > 0) {
            throw new Error(`Missing secrets: ${missingSecretNames.join(", ")}`);
          }

          const secrets = Object.fromEntries(
            secretNames.map((name) => [name, process.env[name]]),
          );

          fs.writeFileSync("app/.deploy-secrets.json", JSON.stringify(secrets));
          EOF

      - name: Deploy app
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_KEY }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file .deploy-secrets.json
          workingDirectory: app
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

  deploy-storybook:
    needs: check
    runs-on: ubuntu-latest
    name: Deploy Storybook
    steps:
      - uses: actions/checkout@v4

      - name: Get secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
          secrets: |
            2bad9e23-82af-4fba-b514-b49900e1632f > CLOUDFLARE_ACCOUNT_ID
            f1bf4fa4-0288-4a31-b28b-b499013acdce > CLOUDFLARE_API_KEY

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Build storybook
        run: pnpm run build-storybook

      - name: Deploy storybook
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_KEY }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: storybook
