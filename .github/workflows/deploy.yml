name: Deploy

on:
    workflow_dispatch:
    workflow_call:
    push:
        branches:
            - main
permissions:
    contents: read
    id-token: write

env:
    CF_SEND_TELEMETRY: "false"

jobs:
    check:
        runs-on: ubuntu-latest
        name: Check
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main

            - uses: voidzero-dev/setup-vp@v1.22.0
              with:
                  node-version-file: .node-version
                  cache: true
                  run-install: |
                      args: ["--frozen-lockfile"]

            - name: Check
              run: pnpm run check

            - name: Test
              run: pnpm run test

            - name: Test photo synchronizer
              run: pnpm run test:photos

    deploy-app:
        needs: check
        runs-on: ubuntu-latest
        name: Deploy App
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main

            - name: Load Production Secrets
              uses: nlkomaru/secret-manager@v2
              with:
                  project: "nikomaru-portfolio"
                  env: "production"
                  shared-keys: |
                      CLOUDFLARE_ACCOUNT_ID

            - uses: voidzero-dev/setup-vp@v1.22.0
              with:
                  node-version-file: .node-version
                  cache: true
                  run-install: |
                      args: ["--frozen-lockfile"]

            - name: Build app
              run: pnpm run build

            - name: Deploy app
              working-directory: app
              env:
                  CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || env.CLOUDFLARE_API_KEY }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  trap 'rm -f .deploy-secrets.json' EXIT
                  node <<'EOF'
                  const fs = require("node:fs");

                  // CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET は Worker の secrets_store_secrets
                  // バインディング (cloudflare.config.ts) から供給されるため、ここでは push しない。
                  const secretNames = [
                    "R2_PUBLIC_URL",
                  ];
                  const missingSecretNames = secretNames.filter((name) => !process.env[name]);

                  if (missingSecretNames.length > 0) {
                    throw new Error(`Missing secrets: ${missingSecretNames.join(", ")}`);
                  }

                  const secrets = Object.fromEntries(
                    secretNames.map((name) => [name, process.env[name]]),
                  );

                  fs.writeFileSync(".deploy-secrets.json", JSON.stringify(secrets));
                  EOF
                  pnpm exec cf deploy --prebuilt --secrets-file .deploy-secrets.json

    deploy-storybook:
        if: github.event_name != 'schedule' && github.event_name != 'workflow_call'
        needs: check
        runs-on: ubuntu-latest
        name: Deploy Storybook
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main

            - name: Load Production Secrets
              uses: nlkomaru/secret-manager@v2
              with:
                  project: "nikomaru-portfolio"
                  env: "production"
                  shared-keys: |
                      CLOUDFLARE_ACCOUNT_ID

            - uses: voidzero-dev/setup-vp@v1.22.0
              with:
                  node-version-file: .node-version
                  cache: true
                  run-install: |
                      args: ["--frozen-lockfile"]

            - name: Build storybook
              run: pnpm run build-storybook

            - name: Deploy storybook
              working-directory: storybook
              env:
                  CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || env.CLOUDFLARE_API_KEY }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
              run: pnpm exec cf deploy --prebuilt
